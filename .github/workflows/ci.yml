name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly run so the dependency audit catches newly disclosed advisories
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    env:
      NODE_ENV: test
      GOOGLE_CLIENT_ID: test-client-id-for-ci
      GOOGLE_CLIENT_SECRET: test-client-secret-for-ci
      GOOGLE_REDIRECT_URI: http://localhost:4153/oauth2callback

    steps:
    - uses: actions/checkout@v5

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Validate (typecheck, test types, lint, test, circular deps)
      run: pnpm run validate

    - name: Build
      run: pnpm run build

    # stdout carries JSON-RPC; a stray log line or dependency banner breaks MCP.
    - name: Verify stdout stays clean at startup
      run: pnpm run check-stdio

  coverage:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      GOOGLE_CLIENT_ID: test-client-id-for-ci
      GOOGLE_CLIENT_SECRET: test-client-secret-for-ci
      GOOGLE_REDIRECT_URI: http://localhost:4153/oauth2callback

    steps:
    - uses: actions/checkout@v5

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Test with coverage
      run: pnpm run test:coverage

    - name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage/lcov.info
        fail_ci_if_error: false

  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Audit dependencies
      run: pnpm audit --audit-level=high
