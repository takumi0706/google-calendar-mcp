name: Publish Package to NPM

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm provenance attestation
      id-token: write

    env:
      NODE_ENV: test
      GOOGLE_CLIENT_ID: test-client-id-for-publish
      GOOGLE_CLIENT_SECRET: test-client-secret-for-publish
      GOOGLE_REDIRECT_URI: http://localhost:4153/oauth2callback

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org/'
          cache: 'pnpm'

      # --frozen-lockfile fails the build if pnpm-lock.yaml is out of sync with
      # package.json. Never fall back to a non-locked install here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm run validate

      - name: Build
        run: pnpm run build

      - name: Verify stdout stays clean at startup
        run: pnpm run check-stdio

      # Trusted publishing (OIDC) needs npm >= 11.5.1; the npm bundled with
      # Node 22 is still 10.x.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      # Published with the npm CLI rather than `pnpm publish` because only the
      # npm CLI supports trusted publishing and --provenance.
      #
      # Authentication is OIDC-based (npm trusted publishing), so no NPM_TOKEN
      # is involved. Long-lived tokens kept breaking this job: first an expired
      # token (404 on PUT), then a 403 because the account requires 2FA for
      # publishing and CI cannot answer an OTP prompt. Trusted publishing is
      # exempt from that policy and issues short-lived, workflow-scoped
      # credentials instead.
      #
      # Requires a trusted publisher configured on npmjs.com for this package:
      #   repository = takumi0706/google-calendar-mcp, workflow = publish.yml
      #
      # Lifecycle scripts are skipped since validate and build already ran.
      - name: Publish to npm
        run: npm publish --provenance --access public --ignore-scripts
